<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:title" content="A PAYLOAD map for you"><meta property="og:description" content="Play this community map in PAYLOAD."><meta property="og:image" content="https://erblinkrasniqi.github.io/banner.png"><title>PAYLOAD – community map</title><link rel="icon" href="../icon.png"><style>
:root { --bg:#14101c; --panel:#1f1830; --text:#f2eef8; --muted:#b7aec8; --accent:#ff8c1a; --accent2:#ff2ea0; --line:#3a2f52; }
@media (prefers-color-scheme: light) { :root { --bg:#faf7fd; --panel:#ffffff; --text:#1d1726; --muted:#5b5168; --line:#e4dced; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
a { color: var(--accent); }
h1 { font-size: 2rem; line-height:1.2; margin: 0 0 8px; }
h2 { margin-top: 2.2em; font-size: 1.35rem; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
table { width:100%; border-collapse: collapse; margin: 12px 0; font-size: .95rem; }
th, td { border: 1px solid var(--line); padding: 8px; text-align:left; vertical-align: top; }
th { background: var(--panel); }
hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
code { background: var(--panel); padding: 1px 5px; border-radius: 4px; }
nav { display:flex; gap:16px; flex-wrap:wrap; margin-bottom: 24px; font-weight:600; }
.hero { display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
.hero img.icon { width:112px; height:112px; border-radius:24px; }
.banner { width:100%; border-radius:14px; margin: 20px 0; }
.btn { display:inline-block; background:linear-gradient(90deg,var(--accent2),var(--accent)); color:#fff; padding:12px 22px; border-radius:10px; text-decoration:none; font-weight:700; }
.muted { color: var(--muted); }
footer { margin-top: 48px; color: var(--muted); font-size: .9rem; }
</style></head>
<body><main>
<nav><a href="../">PAYLOAD</a><a href="../privacy/">Privacy Policy</a><a href="../terms/">Terms of Use</a></nav>

<div class="hero"><img class="icon" src="../icon.png" alt="PAYLOAD icon">
<div><h1>A PAYLOAD map for you</h1><p class="muted" id="lead">Someone shared a community map. Play it in PAYLOAD:</p></div></div>
<p style="font:800 3rem/1.2 ui-monospace,Consolas,monospace;letter-spacing:.25em;margin:24px 0" id="code">------</p>
<p><a class="btn" id="open" href="#">Open in PAYLOAD</a> <a class="btn" href="https://play.google.com/store/apps/details?id=com.pinkmanstudio.payload">Get it on Google Play</a>
<button class="btn" id="copy" style="border:0;cursor:pointer">Copy code</button></p>
<p class="muted">Or open PAYLOAD → <strong>COMMUNITY</strong> → <strong>ENTER CODE</strong> and type the code.</p>
<script>
(function () {
  var m = /[?&]c=([A-Za-z0-9]{6})(?:&|$)/.exec(location.search);
  var code = m ? m[1].toUpperCase() : "";
  if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) code = "";
  var el = document.getElementById("code");
  var open = document.getElementById("open");
  var copy = document.getElementById("copy");
  if (!code) {
    el.textContent = "------";
    document.getElementById("lead").textContent = "This link has no map code. Ask your friend for the 6-letter code.";
    open.style.display = "none"; copy.style.display = "none";
    return;
  }
  el.textContent = code;
  document.title = "PAYLOAD map " + code;
  open.href = "intent://erblinkrasniqi.github.io/l/?c=" + code + "#Intent;scheme=https;package=com.pinkmanstudio.payload;S.browser_fallback_url=" +
              encodeURIComponent("https://play.google.com/store/apps/details?id=com.pinkmanstudio.payload") + ";end";
  if (!/Android/i.test(navigator.userAgent)) open.style.display = "none";
  copy.onclick = function () {
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(function () { copy.textContent = "Copied!"; });
  };
})();
</script>

<footer>© Pinkman Studio · <a href="mailto:erblini.kr@gmail.com">erblini.kr@gmail.com</a></footer>
</main></body></html>
